<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="50%" stop-color="#0C345B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Borda luminosa sutil -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Órbita 360 Exterior -->
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="url(#orbitGrad)" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-28 256 256)" opacity="0.85" filter="url(#glow)"/>
  
  <!-- Satélite na órbita -->
  <circle cx="95" cy="180" r="10" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="417" cy="332" r="8" fill="#34D399" filter="url(#glow)"/>

  <!-- Cubo Isométrico 3D (Carga / Logística) -->
  <g transform="translate(256, 235)">
    <!-- Top Face -->
    <polygon points="0,-75 75,-32 0,10 -75,-32" fill="url(#boxTop)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="-75,-32 0,10 0,95 -75,52" fill="url(#boxLeft)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="0,10 75,-32 75,52 0,95" fill="url(#boxRight)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Fita Adesiva / Linhas do Pacote -->
    <polygon points="0,-75 16,-66 0,-56 -16,-66" fill="#F8FAFC" opacity="0.4"/>
    <polygon points="-38,-53 -22,-44 -22,-36 -38,-44" fill="#F8FAFC" opacity="0.3"/>
  </g>

  <!-- Tipografia LOGISTIX 360 -->
  <text x="256" y="395" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    LOGISTIX<tspan fill="#38BDF8">360</tspan>
  </text>
  
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="2">
    TORRE DE CONTROLE
  </text>
</svg>
